name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove binary files from history
        run: |
          git filter-branch --force --index-filter \
            'git rm --cached --ignore-unmatch docs/images/metal_nut_demo.png docs/images/transistor_demo.png' \
            --prune-empty --tag-name-filter cat -- --all

      - name: Remove files not needed for HF Spaces
        run: |
          rm -rf docs/
          rm -rf notebooks/
          rm -f docker-compose.yml
          rm -rf docker/

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "deploy@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || git commit -m "deploy: remove non-essential files"
          git remote add space https://Salim118:$HF_TOKEN@huggingface.co/spaces/Salim118/visionguard-ai
          git push --force space main
