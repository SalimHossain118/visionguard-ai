name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove binary files from history
        run: |
          git filter-branch --force --index-filter \
            'git rm --cached --ignore-unmatch -r docs/images/ backend/data/samples/' \
            --prune-empty --tag-name-filter cat -- --all

      - name: Remove files not needed for HF Spaces
        run: |
          rm -rf docs/
          rm -rf notebooks/
          rm -f docker-compose.yml
          rm -rf docker/
          rm -rf backend/data/samples/

      - name: Create HF Spaces README
        run: |
          cat > README.md << 'EOF'
          ---
          title: VisionGuard AI
          emoji: 🏭
          colorFrom: blue
          colorTo: red
          sdk: docker
          pinned: false
          app_port: 7860
          ---

          # VisionGuard AI
          Industrial AI Quality Control System — Computer Vision + LLM + Multi-Agent AI
          EOF

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "deploy@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || git commit -m "deploy: prepare for HF Spaces"
          git remote add space https://Salim118:$HF_TOKEN@huggingface.co/spaces/Salim118/visionguard-ai

          # Retry up to 3 times with 5 minute delay between attempts
          for i in 1 2 3; do
            echo "Push attempt $i..."
            git push --force space main && echo "Success!" && break
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed. Waiting 5 minutes before retry..."
              sleep 300
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done
